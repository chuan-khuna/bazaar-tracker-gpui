[workspace]
members = ["apps/tracker", "crates/*"]
# The resolver edition 2024 packages use; a virtual workspace has no package to take it from.
resolver = "3"

# `just tracker run` builds in debug; the dependencies (gpui above all) are built optimised, or the
# window lags while scrolling. The app's own code stays quick to build and to debug.
[profile.dev.package."*"]
opt-level = 2
