[project]
name = "bazaar-odds-scraper"
version = "0.1.0"
description = "Save Bazaar DB's item odds as JSON files the tracker can import"
requires-python = ">=3.12"
dependencies = ["playwright>=1.48"]

[project.scripts]
scrape-odds = "bazaar_odds_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_odds_scraper"]
