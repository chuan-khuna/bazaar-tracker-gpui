[project]
name = "bazaar-odds-scraper"
version = "0.1.0"
description = "Save Bazaar DB's item odds and players' runs as JSON files"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.48",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
scrape-odds = "bazaar_odds_scraper.cli:main"
scrape-runs = "bazaar_run_scraper.cli:main"
start-browser = "bazaar_odds_scraper.browsers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_odds_scraper", "src/bazaar_run_scraper"]
