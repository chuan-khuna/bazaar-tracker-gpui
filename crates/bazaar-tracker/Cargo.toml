[package]
name = "bazaar-tracker"
version = "0.1.0"
edition = "2024"
description = "Everything Bazaar-specific with no UI: log following, game memory, the run state machine, history, the card catalog and uploading."
publish = false

[target.'cfg(windows)'.dependencies]
unityspy-rs = { path = "../unityspy-rs" }

[dependencies]
flate2 = "1"
image = { version = "0.25.10", default-features = false }
keyring = { version = "3", features = ["windows-native"] }
lz4_flex = "0.14.0"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture2ddecoder = "0.1.2"
tracing = "0.1"
ureq = "3"
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
tempfile = "3"
